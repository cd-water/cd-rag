services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cd-rag-postgres
    environment:
      POSTGRES_USER: cdwaterpostgres
      POSTGRES_PASSWORD: cdwaterpostgres
      POSTGRES_DB: cd_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9
    container_name: cd-rag-redis
    command: redis-server --requirepass cdwaterredis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:4.1.8-management
    container_name: cd-rag-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cdwaterrabbitmq
      RABBITMQ_DEFAULT_PASS: cdwaterrabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cd-rag-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: cdwaterminio
      MINIO_ROOT_PASSWORD: cdwaterminio
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
